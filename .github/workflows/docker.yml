name: Build & Push

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the x86 GHA runner emulate ARM64 instructions during
      # the arm64 build leg. Needed for cross-arch builds without a
      # separate arm64 runner. Covers Raspberry Pi 4 / Pi 5 (issue #43
      # sonntam, #76 acaonweb).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # NutriTrace uses GHCR_TOKEN (a PAT) rather than the auto-provided
      # GITHUB_TOKEN because the package was originally created by a
      # different workflow config; PAT bypasses the inheritance quirk.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derive tags from the ref, mirrored to both registries:
      #   semver tag v1.2.3 → :1.2.3, :1.2, :1, :latest
      #   push to main      → :latest
      #   push to dev       → :dev
      # Users pin :dev for the leading edge, :latest for stable
      # releases, or :1.0 for auto-patch within a minor. Same tag set
      # exists at both ghcr.io/traceapps/nutritrace (primary) and
      # traceapps/nutritrace on Docker Hub (discoverability mirror).
      #
      # `:main` and `:sha-*` intentionally not emitted:
      #   - `:main` would be identical to `:latest` (both fire on every
      #     main push) — redundant.
      #   - `:sha-*` per-commit tags accumulate fast on a busy dev branch
      #     and clutter the registry tag list — reproducibility for
      #     stable is covered by `:1.2.3` semver pins, and dev-side
      #     reproducibility can use manifest digests instead.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/traceapps/nutritrace
            traceapps/nutritrace
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
